<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="ad.size" content="width=600,height=300" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0"
    />
    <title>Example-1-Peel-with-Slides-Eva-Air-16:9</title>
    <link rel="stylesheet" type="text/css" href="./style/style.css" />
  </head>
  <body>
    <div class="container" id="container">
      <div id="top-left" class="yellow peel">
        <div class="peel-top">
          <!-- <div class="logo-intro">
            <a>
              <img src="./img/EVA-Air_logo_white.webp" />
            </a>
          </div> -->
          <video
            id="myVideo"
            autoplay
            muted
            playsinline
            poster="./img/video-poster.jpg"
          >
            <source src="./video/video.mp4" type="video/mp4" />
          </video>
        </div>
        <div class="peel-back"></div>
        <div class="peel-bottom">
          <video
            id="myVideo-behind"
            controls
            playsinline
            poster="./img/video-poster.jpg"
          >
            <source src="./video/Behind_Peel_Video.mp4" type="video/mp4" />
          </video>
          <div class="video-hotspot"></div>
          <div class="slider-container">
            <!-- <div
              class="logo"
              onclick="window.open(window.clickTag1, '_blank');"
            >
              <a>
                <img src="./img/EVA-Air_logo_white.webp" />
              </a>
            </div> -->
          </div>
        </div>
      </div>
      <div class="clickArea"></div>
      <div class="dragArea"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="./scripts/peel.js"></script>
    <script src="./scripts/main.js"></script>
  </body>
</html>
